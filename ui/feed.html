<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PodBlendz Feed</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

      background:#050505;

      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width:700px;
      min-height: 100vh;

      background:#050505;

      border-radius: 24px;
      overflow: hidden;
    }

    /* HEADER */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 1rem 0.8rem;
    }

    .logo {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: white;
    }

    .header-right {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .profile-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* COMPOSER */
    .composer {
      background: #0d0d0d;
      border: 1px solid rgba(255,255,255,.08);
      margin: 0 1rem;
      padding: 0.8rem;
      border-radius: 20px;

      display: flex;
      align-items: center;
      gap: 0.8rem;

      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    }

    .composer-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
    }

    .composer input {
      flex: 1;
      background: transparent;
      color: white;
      border: none;
      outline: none;
      font-size: 0.95rem;
    }

    .blend-btn {
      background: #ff6a00;
      color:white;
      border: none;
      padding: 0.7rem 1rem;
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
    }

    .blend-btn {
  background: #ff6a00;
  border: none;
  padding: 0.7rem 1rem;
  border-radius: 999px;
  font-weight: 600;
  cursor: pointer;
}

/* ADD HERE */

.topic-strip{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:12px 16px;
}

.topic-strip::-webkit-scrollbar{
  display:none;
}

.topic-pill{
  background:#181818;
  color:white;
  border:1px solid rgba(255,255,255,.08);
  border-radius:999px;
  padding:8px 12px;
  white-space:nowrap;
  cursor:pointer;
}

.topic-pill:hover{
  border-color:#ff6a00;
}

/* TABS */

.tabs {
  display: flex;
  gap: 0.7rem;
  overflow-x: auto;
  padding: 1rem 1rem 0.5rem;
}

    /* TABS */
    .tabs {
      display: flex;
      gap: 0.7rem;
      overflow-x: auto;
      padding: 1rem 1rem 0.5rem;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      border: none;
      background: #181818;
      color: #999;
      padding: 0.6rem 1rem;
      border-radius: 999px;
      white-space: nowrap;
    }

    .tab.active {
      background: #ff6a00;
      color: white;
    }

    /* FEED */
    .feed {
      padding: 0.6rem 1rem 7rem;
    }

    /* CARD */
    .card {
      background: #0d0d0d;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 26px;
      padding: 1rem;
      margin-bottom: 1.1rem;
      color: white;
    }

    .card-title {
      font-size:1.3rem;
      line-height:1.3;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .card-description {
      color: #555;
      font-size: 0.95rem;
      margin-bottom: 0.8rem;
    }

    .card-description {
  color: rgba(255,255,255,.65);
  font-size: 0.95rem;
  margin-bottom: 0.8rem;
}

/* ADD HERE */

.category-label{
  color:#ff6a00;
  font-size:.75rem;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:8px;
}

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 0.6rem;
}


    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.6rem;
    }

    .tag {
  background: transparent;
  color: #999;
  border: 1px solid rgba(255,255,255,.08);
  padding: 0.35rem 0.7rem;
  border-radius: 999px;
  font-size: 0.8rem;
}



.tag:hover {
  border-color: #ff6a00;
  color: white;
}

   

   

    .actions {
      font-size: 0.9rem;
      color: #666;
    }

    /* NAV */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 430px;
      left: 50%;
      transform: translateX(-50%);

      background:#0d0d0d;
      border-top:1px solid rgba(255,255,255,.08);

      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0.9rem 0;
    }

    .nav-item {
      font-size: 0.82rem;
      color: #aaa;
    }

    .nav-plus {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #cfa85c;
      color: white;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 2rem;
      margin-top: -32px;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="app-header">
    <div class="logo">PODBLENDZ</div>
    <div class="header-right">
      <div class="notification-icon">
        🔔

      </div>
      
      <img class="profile-avatar" src="https://i.pravatar.cc/100?img=12" />
    </div>
  </div>

  <!-- COMPOSER -->
  <div class="composer">
    <img class="composer-avatar" src="https://i.pravatar.cc/100?img=15" />
    <input placeholder="Share a blend, a lesson, a shift..." />
    <button class="blend-btn">Blend</button>
  </div>

  <div class="topic-strip">

    <button class="topic-pill">
      🧠 Brain Health
    </button>

    <button class="topic-pill">
      🤖 AI
    </button>

    <button class="topic-pill">
      💰 Business
      </button>

    <button class="topic-pill">
        ❤️ Relationships
      </button>
    
  </div>





  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" onclick="setView('blends')">Top Blends</button>
    <button class="tab" onclick="setView('creators')">Top Creators</button>
    <button class="tab" onclick="setView('following')">Boards</button>
    <button class="tab" onclick="setView('recent')">Trending</button>
    <button class="tab" onclick="setView('all')">Topics</button>
  </div>

  <!-- FEED -->

  
  <div class="feed" id="feed"></div>

  <!-- NAV -->
  <div class="bottom-nav">
    <div class="nav-item">Home</div>
    <div class="nav-item">Boards</div>
    <div class="nav-plus">+</div>
    <div class="nav-item">Creators</div>
    <div class="nav-item">Profile</div>
  </div>

</div>

<!-- ✅ DATA FIRST -->
<script src="scripts/blends.js"></script>

<!-- ✅ LOGIC SECOND -->
<script src="scripts/feed.js?v=>"></script>

<script>
/* ✅ STEP 2: SOURCE NAVIGATION */
function goToSource(name, event) {
  event.stopPropagation();
  window.location.href =
    '/ui/source.html?name=' + encodeURIComponent(name);
}

function openBlend(id){

  localStorage.setItem(
    "dnaSeedBlendId",
    id
  );

  window.location.href =
    `./blend.html?id=${id}`;
}
</script>

</body>
</html>
