<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PodBlendz Feed</title>
<meta name="description" content="Browse blended podcast conversations by topic, creator, and board." />
<meta name="theme-color" content="#050505" />

<meta property="og:type" content="website" />
<meta property="og:site_name" content="PodBlendz" />
<meta property="og:title" content="PodBlendz Feed" />
<meta property="og:description" content="Browse blended podcast conversations by topic and creator." />
<meta property="og:url" content="https://www.podblendz.com/feed.html" />

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎧%3C/text%3E%3C/svg%3E">

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#050505;
  --card:#0d0d0d;
  --card2:#141414;
  --line:rgba(255,255,255,.09);
  --orange:#ff6a00;
  --muted:rgba(255,255,255,.6);
}

body{
  background:var(--bg);
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex;
  justify-content:center;
}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:3px}

.app{
  width:100%;
  max-width:720px;
  min-height:100vh;
  padding:0 16px 120px;
}

/* ---------- header ---------- */
.app-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:18px 0 14px;
}
.logo{font-size:1.5rem;font-weight:700;text-decoration:none;color:#fff}
.logo span{color:var(--orange)}
.profile-avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}

.page-title{font-size:2rem;line-height:1.1;margin-top:6px}
.subtitle{color:var(--muted);margin:6px 0 18px}

/* ---------- search ---------- */
.search{
  width:100%;
  background:#0f0f0f;
  border:1px solid rgba(255,106,0,.25);
  color:#fff;
  padding:14px 16px;
  border-radius:14px;
  font-size:1rem;
}
.search::placeholder{color:rgba(255,255,255,.45)}
.search:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,106,0,.15)}

/* ---------- topic chips ---------- */
.topic-strip{
  display:flex;gap:8px;overflow-x:auto;
  padding:14px 0 4px;scrollbar-width:none;
}
.topic-strip::-webkit-scrollbar{display:none}
.topic-pill{
  flex:none;background:#181818;color:#fff;
  border:1px solid var(--line);border-radius:999px;
  padding:8px 14px;white-space:nowrap;cursor:pointer;font-size:.9rem;
}
.topic-pill:hover{border-color:var(--orange)}
.topic-pill.active{background:var(--orange);border-color:var(--orange)}

/* ---------- view tabs ---------- */
.tabs{
  display:flex;gap:26px;
  border-bottom:1px solid var(--line);
  margin:14px 0 18px;
}
.tab{
  background:none;border:none;color:var(--muted);
  padding:10px 0;font-size:1rem;cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab:hover{color:#fff}
.tab.active{color:var(--orange);border-bottom-color:var(--orange)}

/* ---------- cards (rendered by scripts/feed.js) ---------- */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
  cursor:pointer;
  transition:border-color .15s, transform .1s;
}
.card:hover{border-color:rgba(255,106,0,.55)}
.card:active{transform:scale(.985)}

.category-label{
  color:var(--orange);font-size:.72rem;font-weight:700;
  letter-spacing:.08em;margin-bottom:8px;
}
.card-title{font-size:1.2rem;line-height:1.3;font-weight:700;margin-bottom:6px;overflow-wrap:anywhere}
.card-description{color:rgba(255,255,255,.65);font-size:.95rem;margin-bottom:10px;overflow-wrap:anywhere}
.card-meta{color:var(--muted);font-size:.9rem}

.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.tag{
  background:#181818;color:rgba(255,255,255,.8);
  border:1px solid var(--line);
  padding:5px 11px;border-radius:999px;font-size:.8rem;
}
.tag:hover{border-color:var(--orange);color:#fff}

.actions{font-size:.9rem;color:var(--muted);display:flex;align-items:center;flex-wrap:wrap}

.blend-btn{
  background:#181818;color:#fff;border:1px solid var(--line);
  border-radius:999px;padding:8px 16px;cursor:pointer;font-size:.9rem;
}
.blend-btn:hover{border-color:var(--orange)}

.state-msg{color:var(--muted);text-align:center;padding:40px 10px}
.state-msg button{
  margin-top:12px;background:var(--orange);color:#fff;border:none;
  border-radius:999px;padding:10px 20px;cursor:pointer;font-weight:600;
}

/* ---------- bottom nav (same as the community page) ---------- */
.bottom-nav{
  display:flex;
  position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:500;
  width:100%;max-width:720px;
  background:rgba(10,10,10,.96);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:8px 8px calc(10px + env(safe-area-inset-bottom));
  justify-content:space-around;align-items:flex-end;
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  color:rgba(255,255,255,.6);font-size:.78rem;text-decoration:none;
  min-width:64px;padding-top:6px;
}
.nav-item .ico{font-size:1.4rem}
.nav-item.active{color:var(--orange)}
.fab{
  width:64px;height:64px;border-radius:50%;border:none;
  background:var(--orange);color:#fff;font-size:2rem;
  margin-top:-26px;cursor:pointer;
  box-shadow:0 6px 20px rgba(255,106,0,.45);
}

@media(max-width:600px){
  .app{padding:0 14px 120px}
  .page-title{font-size:2.4rem}
  .tabs{gap:20px}
}
@media(prefers-reduced-motion:reduce){
  .card{transition:none}
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="app-header">
    <a class="logo" href="/">PodBlendz<span>🎧</span></a>
    <a id="avatarLink" href="/auth/login.html" aria-label="Sign in">
      <img class="profile-avatar" id="avatarImg" alt="" referrerpolicy="no-referrer"
           src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='20' fill='%23222'/%3E%3Ccircle cx='20' cy='15' r='7' fill='%23666'/%3E%3Cpath d='M6 36c2-8 8-11 14-11s12 3 14 11' fill='%23666'/%3E%3C/svg%3E" />
    </a>
  </header>

  <h1 class="page-title" id="pageTitle">Explore</h1>
  <p class="subtitle">Conversations blended from the best podcasts.</p>

  <input
    id="feedSearch"
    class="search"
    type="search"
    placeholder="Search blends, creators, or topics..."
    autocomplete="off" />

  <!-- TOPIC CHIPS -->
  <div class="topic-strip" id="topicStrip">
    <button class="topic-pill" data-board="">All</button>
    <button class="topic-pill" data-board="Brain Health" onclick="openBoard('Brain Health')">🧠 Brain Health</button>
    <button class="topic-pill" data-board="AI" onclick="openBoard('AI')">🤖 AI</button>
    <button class="topic-pill" data-board="Science" onclick="openBoard('Science')">🔭 Science</button>
    <button class="topic-pill" data-board="Finance" onclick="openBoard('Finance')">💰 Finance</button>
    <button class="topic-pill" data-board="Business" onclick="openBoard('Business')">💼 Business</button>
    <button class="topic-pill" data-board="Media" onclick="openBoard('Media')">🎬 Media</button>
    <button class="topic-pill" data-board="Relationships" onclick="openBoard('Relationships')">❤️ Relationships</button>
    <button class="topic-pill" data-board="Parenting" onclick="openBoard('Parenting')">👨‍👩‍👧 Parenting</button>
    <button class="topic-pill" data-board="Politics" onclick="openBoard('Politics')">🏛️ Politics</button>
    <button class="topic-pill" data-board="World Affairs" onclick="openBoard('World Affairs')">🌍 World Affairs</button>
  </div>

  <!-- VIEW TABS -->
  <div class="tabs" role="tablist">
    <button class="tab active" data-view="blends"   role="tab" onclick="setView('blends')">Blends</button>
    <button class="tab"        data-view="creators" role="tab" onclick="setView('creators')">Creators</button>
    <button class="tab"        data-view="following" role="tab" onclick="setView('following')">Boards</button>
  </div>

  <!-- FEED (filled by scripts/feed.js) -->
  <div class="feed" id="feed"></div>

</div>

<!-- BOTTOM NAV (same as the community page) -->
<nav class="bottom-nav">
  <a class="nav-item" id="navHome" href="/feed.html"><span class="ico">🏠</span>Home</a>
  <a class="nav-item" href="/community-feed.html"><span class="ico">👥</span>Community</a>
  <button class="fab" aria-label="New post"
          onclick="window.location.href='/community-feed.html#compose'">+</button>
  <a class="nav-item" id="navExplore" href="/feed.html?view=boards"><span class="ico">🧭</span>Explore</a>
  <a class="nav-item" href="/library.html"><span class="ico">📚</span>Library</a>
</nav>

<!-- DATA FIRST -->
<script src="scripts/blends.js"></script>

<!-- LOGIC SECOND -->
<script src="scripts/feed.js?v=20261114"></script>

<script>
/* signed-in avatar: Google photo, else the person's initial, else a plain silhouette */
function initialAvatar(name) {
  const letter = (String(name || "?").trim()[0] || "?").toUpperCase();
  const svg =
    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'>" +
    "<circle cx='20' cy='20' r='20' fill='#ff6a00'/>" +
    "<text x='20' y='26' font-size='18' font-family='Arial' font-weight='700' " +
    "text-anchor='middle' fill='#fff'>" + letter.replace(/[<>&]/g, "") + "</text></svg>";
  return "data:image/svg+xml," + encodeURIComponent(svg);
}

function readJSON(key) {
  try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
}

function parseJwt(token) {
  const base64 = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
  const json = decodeURIComponent(
    atob(base64).split("").map(c => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join("")
  );
  return JSON.parse(json);
}

(function () {
  let name = null, photo = null, signedIn = false;

  let token = null;
  try { token = localStorage.getItem("googleToken"); } catch {}

  if (token) {
    signedIn = true;
    try {
      const profile = parseJwt(token);
      name  = profile.name;
      photo = profile.picture;
      localStorage.setItem("pbUser", JSON.stringify({
        googleSub:   profile.sub,
        email:       profile.email,
        displayName: profile.name,
        photoUrl:    profile.picture,
        blendzId:    `BLZ-${profile.sub.slice(-8)}`
      }));
    } catch {}
  }

  // fall back to what was saved at sign-in
  const pb  = readJSON("pbUser");
  const pod = readJSON("podblendzUser");
  if (pb || pod) signedIn = true;
  name  = name  || (pb && pb.displayName) || (pod && pod.display_name);
  photo = photo || (pb && pb.photoUrl)    || (pod && pod.photo_url);

  const img  = document.getElementById("avatarImg");
  const link = document.getElementById("avatarLink");

  if (signedIn) {
    link.href = "/library.html";
    link.setAttribute("aria-label", "My library");
    if (name) img.title = name;

    if (photo) {
      img.onerror = () => { img.onerror = null; img.src = initialAvatar(name); };
      img.src = photo;
    } else if (name) {
      img.src = initialAvatar(name);
    }
  }
})();

/* highlight the current topic chip, and the matching bottom-nav item */
(function () {
  const params = new URLSearchParams(window.location.search);
  const board  = params.get("board") || "";
  const view   = params.get("view");

  document.querySelectorAll(".topic-pill").forEach(p => {
    p.classList.toggle("active", (p.dataset.board || "") === board);
  });

  if (board) document.getElementById("pageTitle").textContent = board;

  const onExplore = view === "boards" || view === "creators";
  document.getElementById("navExplore").classList.toggle("active", onExplore);
  document.getElementById("navHome").classList.toggle("active", !onExplore);

  /* "All" clears the board */
  document.querySelector('.topic-pill[data-board=""]').addEventListener("click", () => {
    window.location.href = "/feed.html";
  });
})();

/* deep links:  ?creator=huberman_lab   ?view=creators   ?view=boards */
(function () {
  const params  = new URLSearchParams(window.location.search);
  const creator = params.get("creator");
  const view    = params.get("view");

  if (!creator && view !== "creators" && view !== "boards") return;

  let tries = 0;
  const timer = setInterval(() => {
    const ready =
      typeof BLENDS !== "undefined" &&
      Array.isArray(BLENDS) && BLENDS.length > 0 &&
      typeof openCreator === "function";

    if (ready) {
      clearInterval(timer);
      if (creator) {
        openCreator(creator);
        document.querySelectorAll(".tab").forEach(t =>
          t.classList.toggle("active", t.dataset.view === "creators"));
      } else {
        setView(view === "creators" ? "creators" : "following");
      }
    } else if (++tries > 50) {
      clearInterval(timer);
    }
  }, 200);
})();

/* used by creator tags */
function goToSource(name, event) {
  if (event) event.stopPropagation();
  window.location.href = "/ui/source.html?name=" + encodeURIComponent(name);
}
</script>

</body>
</html>
