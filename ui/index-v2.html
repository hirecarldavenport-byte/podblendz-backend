<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PodBlendz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #ffffff;
    }

    /* NAV */
    .nav {
      padding: 1rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 600;
    }

    /* HERO */
    .hero {
      padding: 2rem 1.2rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
    }

    .hero h1 {
      font-size: clamp(2rem, 6vw, 2.4rem);
      line-height: 1.1;
      font-weight: 700;
    }

    .hero p {
      font-size: 1rem;
      opacity: 0.85;
    }

    /* IMAGE BELOW TEXT (KEY CHANGE) */
    .hero-image-container {
      margin-top: 0.5rem;
      width: 100%;
      height: 220px;
      border-radius: 16px;
      overflow: hidden;
    }

    .hero-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* BUTTONS */
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      margin-top: 0.8rem;
    }

    .btn {
      width: 100%;
      padding: 0.9rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.25);
      background: transparent;
      color: #fff;
      font-size: 0.95rem;
    }

    .btn-primary {
      background: #ff6a00;
      border: none;
      font-weight: 600;
    }

    .cta-note {
      font-size: 0.8rem;
      opacity: 0.7;
      margin-top: 0.3rem;
    }

    /* TOPICS */
    .topics {
      padding: 1.8rem 1.2rem;
      background: #121212;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
    }

    .tile {
      background: #1a1a1a;
      padding: 0.9rem;
      border-radius: 14px;
    }

    .tile h3 {
      font-size: 0.85rem;
      margin-bottom: 4px;
    }

    .tile p {
      font-size: 0.75rem;
      opacity: 0.7;
    }

    /* ===== DESKTOP ===== */
    @media (min-width: 900px) {

      .hero {
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        padding: 6rem 3rem;
      }

      .hero-image-container {
        height: 420px;
      }

      .buttons {
        max-width: 320px;
      }

      .grid {
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      }
    }

  </style>
</head>

<body>

  <!-- NAV -->
  <div class="nav">
    <div class="logo">PodBlendz 🎧</div>
  </div>

  <!-- HERO -->
  <section class="hero">

    <div>
      <h1>Your Podcasts.<br>Your Blendz. Your Way.</h1>
      <p>Listen smarter. Share deeper. Blend ideas.</p>

      <div class="buttons">
        <button class="btn btn-primary" id="generateBlendzBtn">
          Generate Your Blendz
        </button>
        <button class="btn">Watch Demo</button>
      </div>

      <div class="cta-note">
        Start mixing your favorite podcast moments
      </div>
    </div>

    <!-- ✅ CLEAN MOBILE IMAGE -->
    <div class="hero-image-container">
      <img
        class="hero-image"
        src="/assets/black-lady-on-the-train.jpg"
        alt="Podcast listening"
      />
    </div>

  </section>

  <!-- TOPICS -->
  <section class="topics">
    <div class="grid">

      <div class="tile"><h3>AI & Tech</h3><p>Future insights</p></div>
      <div class="tile"><h3>Health</h3><p>Mind + body</p></div>
      <div class="tile"><h3>Finance</h3><p>Money + markets</p></div>
      <div class="tile"><h3>Media</h3><p>Stories + culture</p></div>
      <div class="tile"><h3>Startups</h3><p>Build + scale</p></div>
      <div class="tile"><h3>Science</h3><p>Discovery</p></div>

    </div>
  </section>

  <!-- CTA LOGIC -->
  <script>
    document.getElementById("generateBlendzBtn")
      .addEventListener("click", () => {
        window.location.href = "/onboard/topics.html";
      });
  </script>

</body>
</html>
