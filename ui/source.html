<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Creator</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
      background: #eaeaea;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: #f7f4ef;
      border-radius: 24px;
      overflow: hidden;
    }

    /* ✅ CREATOR HEADER */
    .creator-header {
      background: white;
      padding: 1rem;

      display: flex;
      gap: 12px;
      align-items: center;

      border-bottom: 1px solid #eee;
    }

    .creator-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
    }

    .creator-info h2 {
      font-size: 1.2rem;
      margin-bottom: 4px;
    }

    .creator-info p {
      font-size: 0.85rem;
      color: #666;
    }

    /* ✅ COUNT */
    .count {
      margin-top: 6px;
      font-size: 0.75rem;
      color: #999;
    }

    /* ✅ SECTION TITLE */
    .section-title {
      padding: 1rem 1rem 0.5rem;
      font-size: 0.9rem;
      color: #777;
      font-weight: 600;
    }

    /* ✅ FEED */
    .feed {
      padding: 0 1rem 6rem;
    }

    /* ✅ CARD */
    .card {
      background: white;
      padding: 1rem;
      border-radius: 20px;
      margin-bottom: 1rem;

      box-shadow: 0 4px 16px rgba(0,0,0,0.05);
      transition: transform 0.15s ease;
    }

    .card:active {
      transform: scale(0.98);
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 8px;
    }

    .card-meta {
      font-size: 0.75rem;
      color: #888;
    }

  </style>
</head>

<body>

<div class="app">

  <!-- ✅ HEADER -->
  <div class="creator-header">
    <img 
      class="creator-avatar"
      src="https://i.pravatar.cc/100?img=32"
    />

    <div class="creator-info">
      <h2 id="creatorName">Creator</h2>
      <p>Insights across multiple conversations</p>
      <div class="count" id="blendCount"></div>
    </div>
  </div>

  <!-- ✅ SECTION -->
  <div class="section-title">
    Blends from this creator
  </div>

  <!-- ✅ FEED -->
  <div class="feed" id="feed"></div>

</div>

<!-- ✅ LOAD DATA -->
<script src="scripts/blends.js"></script>

<script>

  const params = new URLSearchParams(window.location.search);

  // ✅ FIX 1: decode URL
  const name = decodeURIComponent(params.get("name") || "");

  // ✅ SET NAME
  document.getElementById("creatorName").innerText =
    name || "Creator";

  // ✅ FIX 2: FLEXIBLE FILTER
  const filtered = BLENDS.filter(b =>
    (b.sources || []).some(s =>
      s.toLowerCase().trim() === name.toLowerCase().trim()
    )
  );

  // ✅ COUNT
  document.getElementById("blendCount").innerText =
    filtered.length + " blend" + (filtered.length !== 1 ? "s" : "");

  const container = document.getElementById("feed");

  // ✅ EMPTY STATE
  if (filtered.length === 0) {
    container.innerHTML = `
      <p style="padding: 1rem; color:#777;">
        No blends found for this creator yet.
      </p>
    `;
  } else {

    // ✅ RENDER CARDS
    container.innerHTML = filtered.map(b => `
      <div class="card" onclick="openBlend('${b.id}')">
        <div class="card-title">${b.title}</div>
        <div class="card-desc">${b.subtitle}</div>
        <div class="card-meta">🎧 ${b.clips} clips</div>
      </div>
    `).join("");

  }

  // ✅ NAVIGATION
  function openBlend(id) {
    window.location.href = '/ui/blend.html?id=' + id;
  }

</script>

</body>
</html>
