<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PodBlendz Blend</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

      background: #f7f4ef;
      color: #111;
      padding: 1.5rem;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    .back {

      display: inline-block;
      margin-bottom: 1rem;

      text-decoration: none;
      color: #666;
      font-size: 0.9rem;
    }

    .hero {

      background: white;

      border-radius: 20px;

      padding: 1.5rem;

      box-shadow:
        0 4px 18px rgba(0,0,0,0.05);

      margin-bottom: 1.5rem;
    }

    .meta-label {

      color: #cfa85c;
      font-size: 0.8rem;

      margin-bottom: 0.5rem;
    }

    .title {

      font-size: 2.2rem;
      font-weight: 700;

      margin-bottom: 0.75rem;
    }

    .description {

      line-height: 1.6;
      color: #555;

      margin-bottom: 1rem;
    }

    #playerStatus {

      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: #666;
    }

    .section-title {

      margin-top: 1.25rem;
      margin-bottom: 0.75rem;

      font-weight: 600;
    }

    .tags {

      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .tag {

      background: #ece7df;

      padding:
        0.45rem
        0.8rem;

      border-radius: 999px;

      font-size: 0.8rem;
    }

    .stats {

      display: flex;
      gap: 1rem;

      margin-top: 1rem;

      color: #666;
    }

    .share-row {

      display: flex;
      gap: 8px;
      flex-wrap: wrap;

      margin-top: 0.75rem;
    }

    .share-btn {

      background: #ece7df;
      border: none;

      padding:
        0.45rem
        0.8rem;

      border-radius: 999px;

      cursor: pointer;
    }

  </style>

</head>

<body>

  <div class="container">

    <a class="back" href="./feed.html">
      ← Back to Feed
    </a>

    <div class="hero">

      <div class="meta-label">
        ✨ Generated Insight
      </div>

      <div
        id="blendTitle"
        class="title">
        Loading...
      </div>

      <div
        id="blendDescription"
        class="description">
        Loading blend...
      </div>

      <audio
        id="audioPlayer"
        controls
        style="width:100%;">
      </audio>

      <div id="playerStatus">
        Loading blend...
      </div>

      <div class="stats">

        <div id="headphoneCount">
          🎧 0
        </div>

        <div id="segmentCount">
          🎙 0 clips
        </div>

      </div>

    </div>
    <div class="section-title">
      Featured Podcast Episodes
    </div>
    <div
    id="episodeSources"
    class="hero">
  </div>

    <div class="section-title">
      Blend Topics
    </div>

    <div
      class="tags"
      id="tags">
    </div>

    <div class="section-title">
      Share this Blend
    </div>

    <div class="share-row">

      <button
        class="share-btn"
        onclick="shareBlend()">
        Share
      </button>

      <button
        class="share-btn"
        onclick="shareTwitter()">
        X
      </button>

      <button
        class="share-btn"
        onclick="shareFacebook()">
        FB
      </button>

      <button
        class="share-btn"
        onclick="copyLink()">
        Copy
      </button>

    </div>

  </div>

  <script>

    async function loadBlend() {

      try {

        const params =
          new URLSearchParams(
            window.location.search
          );

        const id =
          params.get("id");

        if (!id) {

          document.getElementById(
            "playerStatus"
          ).innerText =
            "No Blend ID provided.";

          return;
        }

        const response =
          await fetch(
            `https://api.podblendz.com/blend/${id}`
          );

        if (!response.ok) {

          throw new Error(
            `HTTP ${response.status}`
          );
        }

        const blend =
          await response.json();

          console.log(blend);
          console.log(blend.episode_objects);

          const episodeSources =
  document.getElementById("episodeSources");

if (
  blend.episode_objects &&
  blend.episode_objects.length
) {

  const uniqueEpisodes =
    [...new Map(
      blend.episode_objects.map(
        ep => [ep.episode_id, ep]
)
).values()];

  episodeSources.innerHTML =
  uniqueEpisodes.map(ep => `
  <div style="margin-bottom:12px;">
    <div style="font-weight:600;">
      ${ep.episode_title || "Unknown Episode"}
      </div>
      <div style="
      color:#666;
      font-size:0.9rem;
      ">
      ${ep.podcast_title || "Unknown Podcast"}
      </div>
      </div>
      `).join("");
      } else {


  episodeSources.innerHTML =
    "<p>No episode metadata found.</p>";

}

        document.getElementById(
          "blendTitle"
        ).innerText =
          blend.title ||
          "Untitled Blend";

        document.getElementById(
          "blendDescription"
        ).innerText =
          blend.summary ||
          blend.description ||
          "No summary available.";

        document.getElementById(
          "headphoneCount"
        ).innerText =
          `🎧 ${blend.clip_count}`;

        document.getElementById(
          "segmentCount"
        ).innerText =
          `🎙 ${blend.clip_count} clips`;

        const tagContainer =
          document.getElementById(
            "tags"
          );

        tagContainer.innerHTML = "";

        const tag =
          document.createElement(
            "div"
          );

        tag.className =
          "tag";

        tag.innerText =
          "blend";

        tagContainer.appendChild(
          tag
        );

        const audioPlayer =
          document.getElementById(
            "audioPlayer"
          );

        if (blend.audio_file) {

          audioPlayer.src =
           `https://podblendz-episode-audio.s3.us-east-1.amazonaws.com/blends/${blend.id}/final.mp3`;
            

          document.getElementById(
            "playerStatus"
          ).innerText =
            "Blend loaded.";
        }
        else {

          document.getElementById(
            "playerStatus"
          ).innerText =
            "Audio file unavailable.";
        }

      }
      catch (error) {

        console.error(
          error
        );

        document.getElementById(
          "playerStatus"
        ).innerText =
          "Failed to load Blend.";
      }
    }

    loadBlend();

    const shareText =
      "Check out this Blend on PodBlendz";

    function shareBlend() {

      const shareUrl =
        window.location.href;

      if (navigator.share) {

        navigator.share({

          title:
            "PodBlendz",

          text:
            shareText,

          url:
            shareUrl

        });
      }
      else {

        alert(
          "Use copy link to share"
        );
      }
    }

    function shareTwitter() {

      const shareUrl =
        window.location.href;

      const url =

        "https://twitter.com/intent/tweet?text=" +

        encodeURIComponent(
          shareText
        ) +

        "&url=" +

        encodeURIComponent(
          shareUrl
        );

      window.open(
        url,
        "_blank"
      );
    }

    function shareFacebook() {

      const shareUrl =
        window.location.href;

      const url =

        "https://www.facebook.com/sharer/sharer.php?u=" +

        encodeURIComponent(
          shareUrl
        );

      window.open(
        url,
        "_blank"
      );
    }

    function copyLink() {

      navigator.clipboard.writeText(
        window.location.href
      );

      alert(
        "Link copied!"
      );
    }

  </script>

</body>
</html>
