<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>PodBlendz Blend</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

      background: #f7f4ef;
      color: #111;

      padding: 1.5rem;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .back {
      margin-bottom: 1.5rem;
      display: inline-block;
      text-decoration: none;
      color: #555;
    }

    .title {
      font-size: 2.5rem;
      line-height: 1.05;
      margin-bottom: 1rem;
      font-weight: 700;
    }

    .description {
      color: #555;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .play-button {

      width: 72px;
      height: 72px;

      border-radius: 50%;

      background: #cfa85c;

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 2rem;

      margin-bottom: 2rem;
    }

    .section-title {
      font-size: 1rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .tag {
      background: #ece7df;

      padding:
        0.5rem
        0.9rem;

      border-radius: 999px;

      font-size: 0.85rem;
    }

  </style>

</head>

<body>

  <div class="container">

    <a
      class="back"
      href="./feed.html"
    >
      ← Back
    </a>

    <div
      class="title"
      id="blendTitle"
    >
      Loading...
    </div>

    <div
      class="description"
      id="blendDescription"
    >
      Generating semantic blend...
    </div>

    <div class="play-button">
      ▶
    </div>

    <div class="section-title">
      Blend Topics
    </div>

    <div
      class="tags"
      id="tags"
    ></div>

  </div>

  <script>

    const params =
      new URLSearchParams(window.location.search);

    const topic =
      decodeURIComponent(
        params.get("topic") || ""
      );

    document.getElementById(
      "blendTitle"
    ).innerText = topic;

    document.getElementById(
      "blendDescription"
    ).innerText =
      "An AI-guided blend generated from semantic podcast intelligence.";

    const tags =
      topic.split(" ");

    const tagContainer =
      document.getElementById("tags");

    tags.forEach(tag => {

      const div =
        document.createElement("div");

      div.className = "tag";

      div.innerText = tag;

      tagContainer.appendChild(div);

    });

  </script>

</body>
</html>
