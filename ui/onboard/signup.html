<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | PodBlendz</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0f0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            padding: 20px;
        }

        .signup-card {
            width: 100%;
            max-width: 500px;

            background: #161616;
            padding: 2rem;

            border-radius: 18px;
            box-shadow: 0 0 30px rgba(0,0,0,.25);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: rgba(255,255,255,.7);
            margin-bottom: 20px;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;

            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.15);

            background: #0f0f0f;
            color: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #ff6a00;
        }

        .signup-btn {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 999px;

            background: #ff6a00;
            color: white;

            font-weight: 600;
            cursor: pointer;

            margin-top: 10px;
        }

        .signup-btn:hover {
            opacity: .95;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: rgba(255,255,255,.75);
        }

        .login-link a {
            color: #ff6a00;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .topics {
            margin-top: 10px;
            margin-bottom: 15px;
        }

        .topics h3 {
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .checkbox {
            margin-bottom: 10px;
        }

        .checkbox label {
            margin-left: 8px;
        }
    </style>
</head>

<body>

    <div class="signup-card">

        <h1>Create Your Account 🎧</h1>

        <p>
            Get personalized Blendz delivered daily based on the topics you care about.
        </p>

        <input
            type="text"
            placeholder="First Name">

        <input
            type="email"
            placeholder="Email Address">

        <input
            type="password"
            placeholder="Password">

        <input
            type="password"
            placeholder="Confirm Password">

        <div class="topics">

            <h3>Select Your Interests</h3>

            <div class="checkbox">
                <input type="checkbox" id="ai">
                <label for="ai">AI & Technology</label>
            </div>

            <div class="checkbox">
                <input type="checkbox" id="finance">
                <label for="finance">Finance</label>
            </div>

            <div class="checkbox">
                <input type="checkbox" id="health">
                <label for="health">Health & Wellness</label>
            </div>

            <div class="checkbox">
                <input type="checkbox" id="business">
                <label for="business">Business & Startups</label>
            </div>

            <div class="checkbox">
                <input type="checkbox" id="science">
                <label for="science">Science</label>
            </div>

            <div class="checkbox">
                <input type="checkbox" id="education">
                <label for="education">Education & Learning</label>
            </div>

        </div>

        <button class="signup-btn">
            Get Daily Blendz
        </button>

        <div class="login-link">
            Already have an account?
            /auth/login.htmlSign In</a>
        </div>

    </div>

</body>
</html>
