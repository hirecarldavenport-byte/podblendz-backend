<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PodBlendz Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f0f0f;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 2rem;
      background: #161616;
      border-radius: 18px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: rgba(255,255,255,0.7);
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: #0f0f0f;
      color: white;
    }

    .signin-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 999px;
      background: #ff6a00;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .signup-link {
      text-align: center;
      margin-top: 16px;
    }

    .signup-link a {
      color: #ff6a00;
      text-decoration: none;
    }
  </style>
  <script
  src="https://accounts.google.com/gsi/client"
  async
  defer>
</script>
</head>
<body>

  <div class="login-card">

    <h1>Welcome Back 🎧</h1>

    <p>Sign in to access your personalized Blendz.</p>

    <div id="googleSignIn"></div>


    <div class="signup-link">
  First time here?
  Your PodBlendz account will be created automatically after Google sign-in.
</div>

    

    

  </div>
  <script>

function handleCredentialResponse(response) {

  console.log(
    "Google Token:",
    response.credential
  );

  localStorage.setItem(
    "googleToken",
    response.credential
  );

  window.location.href =
    "/community-feed.html";
}

window.addEventListener("load", () => {

  google.accounts.id.initialize({
    client_id:
      "964383747009-f1lesnjpg9gr6bncgh3kbh47ugilj4qd.apps.googleusercontent.com",
    callback:
      handleCredentialResponse
  });

  google.accounts.id.renderButton(
    document.getElementById(
      "googleSignIn"
    ),
    {
      theme: "filled_black",
      size: "large",
      width: 350
    }
  );

});

</script>

</body>
</html>
