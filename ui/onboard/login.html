<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PodBlendz Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f0f0f;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 2rem;
      background: #161616;
      border-radius: 18px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: rgba(255,255,255,0.7);
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: #0f0f0f;
      color: white;
    }

    .signin-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 999px;
      background: #ff6a00;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .signup-link {
      text-align: center;
      margin-top: 16px;
    }

    .signup-link a {
      color: #ff6a00;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="login-card">

    <h1>Welcome Back 🎧</h1>

    <p>Sign in to access your personalized Blendz.</p>

    <input type="email" placeholder="Email Address">

    <input type="password" placeholder="Password">

    <button class="signin-btn">
      Sign In
    </button>

    <div class="signup-link">
      New to PodBlendz?
      /auth/signup.htmlCreate Account</a>
    </div>

  </div>

</body>
</html>
